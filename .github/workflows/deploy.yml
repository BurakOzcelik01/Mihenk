# Otomatik canlıya alma (Cloudflare Workers).
#
# NEDEN VAR: ci.yml bilinçli olarak deploy içermiyor (bkz. o dosyadaki not).
# Bu dosya ayrı tutuluyor çünkü ci.yml hem push hem pull_request'te çalışıyor;
# deploy ise yalnızca main'e giren, testi geçmiş kod için olmalı.
#
# `main`'e her push testleri geçerse `wrangler.demo.jsonc` ile canlıya alınır
# (asıl `wrangler.jsonc` değil — D1/Queues bağımlılığı yüzünden ücretsiz
# planda deploy'u kırıyor, bkz. wrangler.jsonc içindeki §42 notu).
#
# Gerekli GitHub Secret'lar: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
# (Cloudflare Dashboard -> My Profile -> API Tokens -> "Edit Cloudflare Workers"
# şablonuyla oluşturulur, repo Settings -> Secrets and variables -> Actions
# altına eklenir.)
#
# Deploy adımı `cloudflare/wrangler-action` KULLANMIYOR: o action varsayılan
# olarak kendi Wrangler sürümünü (3.90.0) kurmaya çalışıyor ve bu, projenin
# `@cloudflare/workers-types` v5 bağımlılığıyla ERESOLVE çakışmasına giriyor
# (ilk deploy denemesinde ölçüldü — bkz. commit geçmişi). Proje zaten
# `wrangler@^4.125.0`'ı devDependency olarak taşıyor; `npm ci` onu kurar,
# `npx wrangler` de doğrudan onu kullanır. Node sürümü 22'ye çıkarıldı çünkü
# wrangler 4.125'in kendi `engines` alanı Node >=22 istiyor.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test + Canlıya Al (demo)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Tip denetimi (tsc --noEmit)
        run: npm run lint

      - name: Birim testleri (vitest)
        run: npm test

      - name: Cloudflare Workers'a yayınla
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # GitHub'ın secret kutusuna kopyala-yapıştırla eklenen değerlere
        # görünmez boşluk/satır sonu karışabiliyor (tarayıcıdan kopyalarken
        # ölçüldü — "Invalid account ID" hatasına yol açtı). Wrangler'a
        # vermeden önce tüm boşluk karakterleri temizlenir.
        run: |
          export CLOUDFLARE_API_TOKEN=$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          export CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          npx wrangler deploy -c wrangler.demo.jsonc --minify
